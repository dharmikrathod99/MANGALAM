<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#ede9fe"/>
      <stop offset="50%" stopColor="#dcd8f4"/>
      <stop offset="100%" stopColor="#c8c1ee"/>
    </linearGradient>

    <!-- Gold Foil Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#F5E3B5"/>
      <stop offset="35%" stopColor="#D8B879"/>
      <stop offset="70%" stopColor="#B38E46"/>
      <stop offset="100%" stopColor="#E9CCA2"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="280" fill="#f472b6" fill-opacity="0.12" filter="url(#softGlow)"/>
  <circle cx="1020" cy="480" r="320" fill="#a855f7" fill-opacity="0.14" filter="url(#softGlow)"/>
  <circle cx="600" cy="315" r="380" fill="#ffffff" fill-opacity="0.3" filter="url(#softGlow)"/>

  <!-- Delicate Outer Gold Border -->
  <rect x="36" y="36" width="1128" height="558" rx="20" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.75"/>
  <rect x="46" y="46" width="1108" height="538" rx="14" fill="none" stroke="#D8B879" stroke-width="1" stroke-dasharray="6 4" stroke-opacity="0.5"/>

  <!-- Decorative Corner Accents -->
  <g stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.85">
    <!-- Top-Left -->
    <path d="M56 86 L86 56 L116 56"/>
    <circle cx="86" cy="86" r="4" fill="#D8B879"/>
    <!-- Top-Right -->
    <path d="M1144 86 L1114 56 L1084 56"/>
    <circle cx="1114" cy="86" r="4" fill="#D8B879"/>
    <!-- Bottom-Left -->
    <path d="M56 544 L86 574 L116 574"/>
    <circle cx="86" cy="544" r="4" fill="#D8B879"/>
    <!-- Bottom-Right -->
    <path d="M1144 544 L1114 574 L1084 574"/>
    <circle cx="1114" cy="544" r="4" fill="#D8B879"/>
  </g>

  <!-- Central Seal Icon -->
  <g transform="translate(600, 160)">
    <circle cx="0" cy="0" r="48" fill="#ffffff" fill-opacity="0.85" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="38" fill="#865365" stroke="#D8B879" stroke-width="1.5"/>
    <text x="0" y="8" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle">O</text>
  </g>

  <!-- Pill Badge -->
  <g transform="translate(600, 248)">
    <rect x="-160" y="-16" width="320" height="32" rx="16" fill="#ffffff" fill-opacity="0.8" stroke="url(#goldGrad)" stroke-width="1.2"/>
    <text x="0" y="5" font-family="'Space Mono', monospace, sans-serif" font-size="11" font-weight="600" fill="#0b0b10" letter-spacing="3" text-anchor="middle">✦ BESPOKE WEDDING ATELIER ✦</text>
  </g>

  <!-- Master Brand Title -->
  <text x="600" y="345" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="64" font-weight="600" fill="#0b0b10" letter-spacing="4" text-anchor="middle">
    OCTOWEDS
  </text>

  <!-- Elegant Subtitle Tagline -->
  <text x="600" y="405" font-family="'Playfair Display', Georgia, serif" font-size="24" font-style="italic" fill="#865365" text-anchor="middle">
    Heirloom Digital Invitations, Unboxed with Devotion
  </text>

  <!-- Gold Accent Divider -->
  <line x1="520" y1="435" x2="680" y2="435" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- Features Strip -->
  <text x="600" y="485" font-family="'DM Sans', sans-serif" font-size="16" font-weight="400" fill="#0b0b10" fill-opacity="0.75" letter-spacing="1" text-anchor="middle">
    Interactive Wax Seal Unboxing  •  Acoustic Sitar Scoring  •  Instant WhatsApp Broadcasting
  </text>
  <text x="600" y="520" font-family="'DM Sans', sans-serif" font-size="14" font-weight="300" fill="#0b0b10" fill-opacity="0.6" text-anchor="middle">
    Smart RSVP Management  •  One-Tap Google Maps Navigation  •  Ultra-HD 9:16 Vertical Screen Suites
  </text>
</svg>

